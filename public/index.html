<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Number Rush</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game-container">

        <!-- =========================
             GAME HEADER
             ========================= -->

        <header class="game-header">

            <div>
                <p class="small-title">
                    NUMBER SEQUENCE CHALLENGE
                </p>

                <h1>Number Rush</h1>
            </div>

            <button
                id="soundBtn"
                class="icon-btn"
                aria-label="Toggle sound"
            >
                🔊
            </button>

        </header>


        <!-- =========================
             LEVEL SELECTION
             ========================= -->

        <section class="level-section">

            <p class="section-label">
                Choose difficulty
            </p>

            <div class="level-buttons">

                <button
                    class="level-btn active"
                    data-level="easy"
                    data-time="35"
                >
                    <span>Easy</span>
                    <small>35 sec</small>
                </button>


                <button
                    class="level-btn"
                    data-level="hard"
                    data-time="25"
                >
                    <span>Hard</span>
                    <small>25 sec</small>
                </button>


                <button
                    class="level-btn"
                    data-level="extreme"
                    data-time="15"
                >
                    <span>Extreme</span>
                    <small>15 sec</small>
                </button>

            </div>

        </section>


        <!-- =========================
             GAME STATS
             ========================= -->

        <section class="stats-grid">

            <div class="stat-card">

                <span class="stat-title">
                    TIME
                </span>

                <strong id="timer">
                    35.0
                </strong>

            </div>


            <div class="stat-card">

                <span class="stat-title">
                    SCORE
                </span>

                <strong id="score">
                    0
                </strong>

                <small>
                    / 25
                </small>

            </div>


            <div class="stat-card">

                <span class="stat-title">
                    NEXT
                </span>

                <strong id="nextNumber">
                    1
                </strong>

            </div>


            <div class="stat-card">

                <span class="stat-title">
                    STREAK
                </span>

                <strong id="streak">
                    x0
                </strong>

            </div>


            <div class="stat-card">

                <span class="stat-title">
                    MISTAKES
                </span>

                <strong id="mistakes">
                    0
                </strong>

            </div>

        </section>


        <!-- =========================
             TIMER PROGRESS
             ========================= -->

        <div class="timer-track">

            <div
                id="timerProgress"
                class="timer-progress"
            ></div>

        </div>


        <!-- WRONG CLICK PENALTY -->

        <div
            id="penaltyMessage"
            class="penalty-message"
        ></div>


        <!-- =========================
             GAME MESSAGE
             ========================= -->

        <section class="game-message">

            <p id="message">
                Click Start Game when you're ready.
            </p>

        </section>


        <!-- =========================
             GAME BOARD
             ========================= -->

        <section
            id="gameBoard"
            class="game-board"
        >

            <!-- Numbers generated by JavaScript -->

        </section>


        <!-- =========================
             GAME CONTROLS
             ========================= -->

        <section class="game-controls">

            <button
                id="startBtn"
                class="start-btn"
            >
                Start Game
            </button>

        </section>


        <!-- =========================
             PERSONAL BEST
             ========================= -->

        <section class="personal-best">

            <div>

                <span>
                    Personal Best
                </span>

                <strong id="bestScore">
                    0 / 25
                </strong>

            </div>


            <div>

                <span>
                    Best Time
                </span>

                <strong id="bestTime">
                    --
                </strong>

            </div>

        </section>

    </main>


    <!-- =========================
         RESULT MODAL
         ========================= -->

    <div
        id="resultModal"
        class="modal hidden"
    >

        <div class="modal-card">

            <div
                id="resultIcon"
                class="result-icon"
            >
                ⚡
            </div>


            <h2 id="resultTitle">
                Time's Up!
            </h2>


            <p id="resultMessage">
                Nice attempt!
            </p>


            <div class="result-stats">

                <div>

                    <span>
                        Score
                    </span>

                    <strong id="finalScore">
                        0 / 25
                    </strong>

                </div>


                <div>

                    <span>
                        Accuracy
                    </span>

                    <strong id="accuracy">
                        100%
                    </strong>

                </div>

            </div>


            <!-- PLAYER NAME -->

            <input
                id="playerName"
                type="text"
                maxlength="20"
                autocomplete="name"
                placeholder="Enter your name"
            >


            <button
                id="saveScoreBtn"
                class="save-score-btn"
            >
                Save Score
            </button>


            <button
                id="playAgainBtn"
                class="play-again-btn"
            >
                Play Again
            </button>


            <button
                id="closeModalBtn"
                class="close-modal-btn"
            >
                Close
            </button>

        </div>

    </div>


    <!-- =========================
         LEADERBOARD
         ========================= -->

    <section class="leaderboard-section">

        <div class="leaderboard-header">

            <div>

                <p class="small-title">
                    GLOBAL RANKINGS
                </p>

                <h2>
                    Leaderboard
                </h2>

            </div>


            <button id="refreshLeaderboard">
                Refresh
            </button>

        </div>


        <!-- LEADERBOARD FILTERS -->

        <div class="leaderboard-filters">

            <button
                class="filter-btn active"
                data-filter="all"
            >
                All
            </button>


            <button
                class="filter-btn"
                data-filter="easy"
            >
                Easy
            </button>


            <button
                class="filter-btn"
                data-filter="hard"
            >
                Hard
            </button>


            <button
                class="filter-btn"
                data-filter="extreme"
            >
                Extreme
            </button>

        </div>


        <!-- LEADERBOARD DATA -->

        <div id="leaderboard">

            <p class="empty-leaderboard">
                Leaderboard will appear here.
            </p>

        </div>

    </section>


    <script src="script.js"></script>

</body>
</html>
